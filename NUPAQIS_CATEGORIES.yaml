- Category: Variational Quantum Algorithms
  Description: >-
    Variational Quantum Algorithms (VQAs) are hybrid quantum-classical
    algorithms that find approximate solutions to optimization problems.
    VQAs starts with a parameterized quantum circuit (PQC) where the parameters
    are optimized by a classical optimizer to minimize (or maximize) a cost
    function. 