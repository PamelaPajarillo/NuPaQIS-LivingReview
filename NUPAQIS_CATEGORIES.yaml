- Category: Event Generation
  Heatmap: Theoretical Nuclear and Particle Physics
  Description: >-
    An event is the outcome of a collision between two incoming particles, or the outcome of an isolated decay of a particle, which consists of a number of outgoing particles. 
    The main components of high-energy particle collisions are: 
    (1) Incoming Hadrons: The initial partons involved in a hard scattering process are selected using parton distribution functions for the incoming hadrons. The incoming hadrons are at an energy of order 1 GeV ($\sim \Lambda_{\text{QCD}}$);
    (2) Hard scattering: The kinematics of the outgoing partons are based on matrix elements calculated in perturbation theory. The hard scattering process is at energy of order 100 to 1000 GeV at the LHC;
    (3) Parton Showers: The incoming and outgoing partons radiate quarks and gluons. This radiation pattern can be approximated semi-classically using a parton shower algorithm. Parton showers links the perturbative and non-perturbative energy regimes; 
    (4) Underlying Event: Scattering also occurs with other partons not associated with the hard scattering process coming from the incoming hadrons. These partons tend to be soft, i.e. lower energy than the partons from the hard scattering process;
    (5) Hadronization: This refers to the formation of hadrons out of quarks and gluons. Hadronization is at an energy of order 1 GeV ($\sim \Lambda_{\text{QCD}}$).
    An event generator is a numerical algorithm that produces random sequences of simulated events. The aim of an event generator is to predict all observable properties of a collision or a decay process. An event generator is an important tool for interpreting collider data because it gives predictions for what an event would look like before interacting with detectors, and is essential to linking theories with experiments.
    Examples of event generators include PYTHIA, HERWIG, SHERPA, MADGRAPH, and POWHEG.


    References:
      - Herwig++ Physics and Manual: https://arxiv.org/abs/0803.0883
      - A comprehensive guide to the physics and usage of PYTHIA 8.3: https://arxiv.org/abs/2203.11601

