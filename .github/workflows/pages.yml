name: Build and publish website

on:
  push:
    branches: [main]
  # Rebuild daily so journal information that lands on INSPIRE after a
  # preprint is posted shows up without anyone touching the repository.
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas urllib3 pyyaml matplotlib seaborn

      # make_web.py makes about three INSPIRE requests per paper. Caching them
      # keeps the daily build quick and is polite to the API.
      - name: Restore INSPIRE cache
        uses: actions/cache@v4
        with:
          path: .inspire_cache
          key: inspire-${{ hashFiles('NUPAQIS.yaml') }}
          restore-keys: inspire-

      - name: Install pdfinfo, for the PDF's page count
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build site data
        run: python make_web.py

      - name: Check the data is usable
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open('web/data/papers.json'))
          papers = data['papers']
          assert papers, 'no papers in papers.json'
          bad = [p['key'] for p in papers if not p['title'] or not p['bibtex']]
          if bad:
              sys.exit('incomplete records: %s' % ', '.join(bad[:5]))
          print('%d papers look fine' % len(papers))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
